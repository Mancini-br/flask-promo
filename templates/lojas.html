<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>Visualizar Lojas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Listagem de Lojas</h1>

        <div class="list-group">
            {% for loja in lojas %}
                <div class="list-group-item">
                    <h5>{{ loja.nome }}</h5>
                    <p><strong>Desconto:</strong> {{ loja.desconto }}%</p>
                    <p><strong>Validade:</strong> {{ loja.validade_dias }} dias</p>
                    <p><strong>Descrição:</strong> {{ loja.descricao }}</p>
                    <p><strong>Localização:</strong> {{ loja.latitude }}, {{ loja.longitude }}</p>
                    {% if is_admin %}
                        <a href="/cadastrar" class="btn btn-primary btn-sm">Editar</a>
                    {% endif %}
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
