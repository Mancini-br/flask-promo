<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lojas com Desconto</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f4f7fc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #map {
            width: 100%;
            height: 400px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .loja {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            margin: 30px 0;
            font-size: 2.5rem;
            color: #333;
            text-align: center;
        }
        .btn-location {
            display: block;
            margin: 20px auto 30px;
            background-color: #28a745;
            color: white;
            border-radius: 30px;
            padding: 10px 30px;
            font-size: 1.2rem;
            border: none;
            transition: background-color 0.3s ease;
        }
        .btn-location:hover {
            background-color: #218838;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Lojas com Desconto Próximas de Você</h1>

    <button class="btn-location" onclick="pegarLocalizacao()">Buscar Lojas Próximas</button>

    <div id="map"></div>

    <div id="lojas" class="row">
        <!-- Aqui as lojas serão listadas dinamicamente -->
    </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- Substitua "SUA_API_KEY_AQUI" pela sua chave de API do Google Maps -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCIUCIf41AYyDrZMnP9eyXQLQBtaJc-HRI&callback=initMap&libraries=places&v=weekly" async defer></script>
<script>
    let map;
    let userMarker;
    let lojaMarkers = [];

    function initMap() {
        // A função initMap é chamada automaticamente quando a API do Google Maps é carregada
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const userLocation = { lat: position.coords.latitude, lng: position.coords.longitude };
                map = new google.maps.Map(document.getElementById('map'), {
                    center: userLocation,
                    zoom: 14
                });

                userMarker = new google.maps.Marker({
                    position: userLocation,
                    map: map,
                    title: "Você está aqui!"
                });

                buscarLojas(position.coords.latitude, position.coords.longitude);
            }, function() {
                alert('Não foi possível obter sua localização.');
            });
        } else {
            alert('Geolocalização não é suportada pelo seu navegador.');
        }
    }

    function pegarLocalizacao() {
        // Este método foi removido, pois a função já é chamada diretamente no initMap após a geolocalização ser obtida
    }

    function buscarLojas(lat, lon) {
        fetch('/buscar_lojas', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ latitude: lat, longitude: lon })
        })
        .then(response => response.json())
        .then(data => {
            mostrarLojas(data);
        })
        .catch(error => {
            console.error('Erro ao buscar lojas:', error);
        });
    }

    function mostrarLojas(lojas) {
        const lojasDiv = document.getElementById('lojas');
        lojasDiv.innerHTML = ''; // Limpar conteúdo

        lojas.forEach(loja => {
            // Criar card da loja
            const lojaElement = document.createElement('div');
            lojaElement.className = 'col-md-6';
            lojaElement.innerHTML = `
                <div class="loja">
                    <h4>${loja.nome}</h4>
                    <p><strong>Descrição:</strong> ${loja.descricao}</p>
                    <p><strong>Desconto:</strong> ${loja.desconto}%</p>
                    <p><strong>Distância:</strong> ${loja.distancia.toFixed(2)} km</p>
                </div>
            `;
            lojasDiv.appendChild(lojaElement);

            // Adicionar marcador no mapa
            const lojaMarker = new google.maps.Marker({
                position: { lat: loja.latitude, lng: loja.longitude },
                map: map,
                title: loja.nome
            });

            lojaMarkers.push(lojaMarker);
        });

        if (lojas.length === 0) {
            lojasDiv.innerHTML = '<p class="text-center">Nenhuma loja encontrada próxima.</p>';
        }
    }
</script>

</body>
</html>
